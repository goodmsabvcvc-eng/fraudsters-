        :root {

            --danger-color: #EF4444;
            --warning-color: #F97316;
            --info-color: #EAB308;
            --success-color: #10B981;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-main); 
            background-image: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05), transparent 40%);
            color: var(--text-main); 
            line-height: 1.6; 
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        .hero { 
            text-align: center; padding: 60px 0 30px; 
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.5) 0%, transparent 100%);
        }
        
        .hero h1 { 
            font-size: 2.8rem; font-weight: 800; 
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary)); 
            -webkit-background-clip: text; background-clip: text; color: transparent; 
        }

        .badge { 
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); 
            color: var(--gold-light); padding: 8px 20px; border-radius: 50px; 
            font-weight: 600; margin-top: 15px; display: inline-flex; align-items: center; gap: 8px;
        }

        .card { 
            background: var(--bg-card); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 20px; 
            padding: 30px; margin: 30px 0; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .search-box { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
        .search-box input { 
            flex: 1; padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.5); color: #fff; font-size: 1.2rem; text-align: center; letter-spacing: 1px;
        }
        .search-box button { 
            background: linear-gradient(135deg, var(--gold-primary), #D97706); 
            color: #000; border: none; padding: 0 35px; border-radius: 14px; 
            font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .search-box button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3); }

        /* نتائج البحث */
        .result-card { border-radius: 15px; padding: 25px; margin-top: 20px; display: none; animation: fadeIn 0.4s forwards; border-right: 8px solid; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .res-danger { border-right-color: var(--danger-color); background: rgba(239, 68, 68, 0.1); }
        .res-warning { border-right-color: var(--warning-color); background: rgba(249, 115, 22, 0.1); }
        .res-info { border-right-color: var(--info-color); background: rgba(234, 179, 8, 0.1); }
        .res-safe { border-right-color: var(--success-color); background: rgba(16, 185, 129, 0.1); }

        .fraud-item { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); }

        /* نموذج الإبلاغ */
        .form-control { width: 100%; padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 15px; font-family: inherit; }
        .btn-wa { background: #25D366; color: #fff; border: none; width: 100%; padding: 18px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem; }
        
        .loader { display: none; text-align: center; margin: 20px 0; color: var(--gold-primary); }
        .loader i { animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

function clean(num) {
    return num.toString().replace(/[^\d]/g, '').replace(/^00/, '');
}

function search() {
    const input = document.getElementById('searchInput').value.trim();
    const resArea = document.getElementById('resultArea');
    const loader = document.getElementById('loader');
    
    if(!input) return;
    
    resArea.style.display = 'none';
    loader.style.display = 'block';
    
    setTimeout(() => {
        loader.style.display = 'none';
        const cleanedInput = clean(input);
        const match = fraudstersDB.find(item => clean(item.p) === cleanedInput);
        
        if(match) {
            let statusText = match.s === 'danger' ? '⚠️ تحذير: نصاب' : (match.s === 'warning' ? '🟠 تنبيه: مشبوه' : '🟡 ملاحظة: محتمل');
            resArea.innerHTML = `
                <div class="result-card res-${match.s}" style="display:block">
                    <h3 style="margin-bottom:10px">${statusText}</h3>
                    <div class="fraud-item">
                        <div><strong>الرقم:</strong> <span dir="ltr">+${match.p}</span></div>
                        <div><strong>الحالة:</strong> ${match.t}</div>
                    </div>

        }
        resArea.style.display = 'block';
    }, 800);
}
